[project]
name = "ai-customer-support"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "faker>=40.44.0",
    "fastapi[standard]>=0.162.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "sqlmodel>=0.0.48",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
